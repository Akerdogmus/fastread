    <!--
      https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP
      script-src without 'unsafe-inline' is what keeps an injected inline handler
      (<img onerror=…>) from ever executing. The last three directives do NOT fall back to
      default-src and so have to be named explicitly: form-action stops injected markup
      POSTing off-origin, base-uri stops an injected <base> re-pointing relative URLs, and
      object-src closes off plugin embedding. No CSP directive can prevent top-level
      navigation, though — that is handled in the main process; see isAllowedAppUrl.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; form-action 'none'; base-uri 'none'; object-src 'none'"
    />
